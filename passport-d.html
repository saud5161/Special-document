<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>نماذج الجوازات</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/all.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/icon-g.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
:root{
  --brand:#1f6b4f;
  --brand-2:#0f3d2c;
  --brand-light:#eaf5ef;
  --gold:#cda94a;
  --gold-light:#e8d49a;
  --ink:#071912;
  --text:#0f172a;
  --radius:22px;
  --radius-sm:14px;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }

body{
  font-family: 'Tajawal', 'Cairo', Arial, sans-serif;
  direction: rtl;
  margin:0;
  padding:0;
  color:#fff;
  overflow-x:hidden;
}

a{ text-decoration:none; color:inherit; }

/* ===== خلفية احترافية: تدرج غامق + شعار الجوازات كعلامة مائية شفافة ===== */
.bg-scene{
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(900px 600px at 12% 8%, rgba(205,169,74,.14), transparent 55%),
    radial-gradient(1000px 700px at 88% 85%, rgba(31,107,79,.45), transparent 55%),
    linear-gradient(160deg, #0a2419 0%, var(--ink) 55%, #0d2e21 100%);
}
.bg-scene::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:url('img/main-httpswww.gdp.gov.saportalassetsimglogo.png');
  background-repeat:no-repeat;
  background-position:center 46%;
  background-size: min(58vw, 620px);
  opacity:.07;
  filter: saturate(1.4);
}
.bg-scene::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px);
  background-size: 26px 26px;
  opacity:.25;
}

/* ===== الصفحة ===== */
.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 32px 16px;
}

/* ===== اللوحة الزجاجية الرئيسية ===== */
.glass-panel{
  position:relative;
  width:min(680px, 96vw);
  background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 28px;
  box-shadow: 0 30px 70px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.14);
  padding: 32px 30px 26px;
  overflow:hidden;
  animation: fadeUp .6s cubic-bezier(.2,.8,.2,1) both;
}
.glass-panel::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:3px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity:.9;
}

/* ===== رأس اللوحة: الشعار + العنوان + التاريخ ===== */
.panel-header{
  display:flex;
  align-items:center;
  gap:14px;
  padding-bottom: 20px;
  margin-bottom: 24px;
  border-bottom: 1px solid rgba(255,255,255,.12);
}
.panel-header img{
  height:52px;
  width:auto;
  filter: drop-shadow(0 8px 14px rgba(0,0,0,.4));
}
.brand-text{ display:flex; flex-direction:column; gap:2px; }
.brand-text h1{
  margin:0;
  font-size: 19px;
  font-weight:900;
  color:#fff;
  letter-spacing:-.2px;
}
.brand-text h1 span{ color: var(--gold-light); }
.brand-text p{
  margin:0;
  font-size: 11.5px;
  color: rgba(255,255,255,.55);
}
#date{
  margin-inline-start:auto;
  font-size: 11.5px;
  color: rgba(255,255,255,.75);
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.14);
  white-space:nowrap;
}

/* ===== المربعات الرئيسية: مغادرة / القدوم ===== */
.hero-grid{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.hero-card{
  position:relative;
  background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
  border: 1px solid rgba(255,255,255,.14);
  border-radius: var(--radius);
  padding: 30px 16px 24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap: 8px;
  text-align:center;
  overflow:hidden;
  isolation:isolate;
  cursor:pointer;
  transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, border-color .3s ease, background .3s ease;
  animation: fadeUp .6s ease both;
}
.hero-card:nth-child(1){ animation-delay: .08s; }
.hero-card:nth-child(2){ animation-delay: .16s; }

.hero-card::after{
  content:"";
  position:absolute;
  inset:-2px;
  background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,.28) 35%, transparent 70%);
  transform: translateX(120%);
  transition: transform .65s ease;
  z-index:0;
}
.hero-card:hover::after{ transform: translateX(-120%); }

.hero-card:hover{
  transform: translateY(-6px);
  border-color: rgba(205,169,74,.5);
  background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
  box-shadow: 0 20px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(205,169,74,.15);
}
.hero-card:active{ transform: translateY(-2px); }

.hero-ring{
  position:relative; z-index:1;
  width: 62px;
  height: 62px;
  border-radius: 50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size: 22px;
  color: var(--gold-light);
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.16), rgba(255,255,255,.02));
  border: 1.5px solid rgba(205,169,74,.5);
  box-shadow: 0 0 0 5px rgba(205,169,74,.08);
  margin-bottom: 4px;
  transition: transform .3s ease, background .3s ease, color .3s ease, box-shadow .3s ease;
}
.hero-card:hover .hero-ring{
  transform: scale(1.08);
  background: linear-gradient(145deg, var(--brand), var(--brand-2));
  color:#fff;
  box-shadow: 0 0 0 7px rgba(205,169,74,.14), 0 10px 20px rgba(0,0,0,.3);
}

.hero-card h2{
  position:relative; z-index:1;
  margin:0;
  font-size: 19px;
  font-weight:900;
  color:#fff;
  letter-spacing:-.2px;
}
.hero-card p{
  position:relative; z-index:1;
  margin:0;
  font-size: 11px;
  color: rgba(255,255,255,.5);
  line-height:1.5;
}

/* ===== فاصل ===== */
.panel-divider{
  height:1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
  margin: 24px 0 16px;
}

/* ===== أدوات ثانوية: أيقونة + عنوان الإجراء فقط ===== */
.utility-row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap: 6px;
}

.utility-card{
  position:relative;
  display:flex;
  align-items:center;
  gap: 8px;
  padding: 9px 16px;
  color: rgba(255,255,255,.62);
  border-radius: 999px;
  cursor:pointer;
  transition: color .22s ease, background .22s ease, transform .22s ease;
  animation: fadeUp .6s ease both;
}
.utility-card:nth-child(1){ animation-delay: .24s; }
.utility-card:nth-child(2){ animation-delay: .30s; }
.utility-card:nth-child(3){ animation-delay: .36s; }

.utility-card:hover{
  color:#fff;
  background: rgba(255,255,255,.08);
  transform: translateY(-2px);
}
.utility-card:active{ transform: translateY(0); }

.utility-icon{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size: 14px;
  color: var(--gold-light);
  transition: transform .22s ease;
}
.utility-card:hover .utility-icon{ transform: scale(1.12); }

.utility-card strong{ font-size: 12.5px; font-weight:700; }

.utility-card .lock-badge{
  font-size: 8.5px;
  color: var(--gold);
  margin-inline-start: 1px;
}

/* ===== نافذة الرقم السري ===== */
.password-container{
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background: rgba(2,6,23,.65);
  backdrop-filter: blur(4px);
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  z-index:1100;
  padding: 18px;
}

.password-box{
  width:min(380px, 100%);
  background: linear-gradient(145deg, #ffffff, #f4f6f7);
  padding: 26px 24px;
  border-radius: var(--radius);
  box-shadow: 0 24px 60px rgba(0,0,0,.4);
  text-align:center;
  position:relative;
  border: 1px solid rgba(15,23,42,.10);
  animation: popIn .22s ease-out;
}

.password-box .lock-icon{
  width:52px; height:52px;
  margin: 0 auto 12px;
  border-radius:16px;
  background: var(--brand-light);
  color: var(--brand);
  display:flex; align-items:center; justify-content:center;
  font-size:20px;
}

.password-box h3{ margin:0 0 4px; font-size:16px; color:var(--text); }
.password-box .sub{ margin:0 0 6px; font-size:11.5px; color:rgba(15,23,42,.55); }

.password-box input{
  padding: 12px 12px;
  font-size: 18px;
  margin: 10px 0;
  width:100%;
  border-radius: 12px;
  border: 1px solid rgba(15,23,42,.15);
  background:#fff;
  text-align:center;
  letter-spacing: 4px;
  transition: box-shadow .2s ease, border-color .2s ease;
}
.password-box input:focus{
  border-color: rgba(31,107,79,.6);
  box-shadow: 0 0 0 4px rgba(31,107,79,.16);
  outline:none;
}

.password-box button{
  padding: 11px 16px;
  font-size: 15px;
  font-weight:700;
  cursor:pointer;
  border:none;
  background: linear-gradient(90deg, var(--brand), var(--brand-2));
  color:#fff;
  border-radius: 12px;
  margin-top: 8px;
  width:100%;
  transition: transform .18s ease, filter .18s ease;
}
.password-box button:hover{ transform: translateY(-1px); filter: brightness(1.08); }

.password-box .close-btn{
  background: linear-gradient(90deg, #f44336, #d32f2f);
  margin-top: 8px;
}

/* ===== إتاحة الوصول ===== */
.hero-card:focus-visible,
.utility-card:focus-visible,
.password-box button:focus-visible,
.password-box input:focus-visible{
  outline: 3px solid rgba(205,169,74,.65);
  outline-offset: 3px;
}

/* ===== الحركات ===== */
@keyframes popIn{
  from{ opacity:0; transform: scale(.96); }
  to{ opacity:1; transform: scale(1); }
}
@keyframes fadeUp{
  from{ opacity:0; transform: translateY(16px); }
  to{ opacity:1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce){
  *{ transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ===== الاستجابة ===== */
@media (max-width: 560px){
  .hero-grid{ grid-template-columns: 1fr; }
  .panel-header{ flex-wrap:wrap; }
  #date{ margin-inline-start:0; order:3; }
  .glass-panel{ padding: 26px 18px 22px; }
}
    </style>
    <script>
        function checkPassword(action) {
            var passwordContainer = document.getElementById("password-container");
            document.getElementById("password-action").value = action;
            document.getElementById("password-input").value = "";
            passwordContainer.style.display = "flex";

            if (action === "update") {
                document.getElementById("password-box-title").textContent = "تأكيد تحديث البرنامج";
                document.getElementById("password-box-sub").textContent = "الرجاء إدخال الرقم السري لتأكيد بدء تحديث كامل البرنامج";
            }

            document.getElementById("password-input").focus();
        }

        function closePasswordBox() {
            document.getElementById("password-container").style.display = "none";
        }

        function verifyPassword() {
            var passwordInput = document.getElementById("password-input").value;
            var action = document.getElementById("password-action").value;

            var passwordsByAction = {
                update: "123123"
            };

            var correctPassword = passwordsByAction[action];

            if (correctPassword && passwordInput === correctPassword) {
                if (action === "update") {
                    window.location.href = "update.html";
                }
            } else {
                alert("الرقم السري غير صحيح");
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            var dateEl = document.getElementById("date");
            if (dateEl) {
                var today = new Date();
                var options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                dateEl.textContent = today.toLocaleDateString('ar-SA', options);
            }

            document.getElementById("password-input").addEventListener("keyup", function(event) {
                if (event.key === "Enter") {
                    verifyPassword();
                }
            });

            // ===== زر "تعديل الملفات": يفتح مجلد النماذج المحلي (dic) عبر الجسر الآمن customAPI =====
            var editFilesBtn = document.querySelector(".open-folder");
            if (editFilesBtn) {
                editFilesBtn.addEventListener("click", function(event) {
                    event.preventDefault();
                    if (window.customAPI && window.customAPI.openFilesFolder) {
                        window.customAPI.openFilesFolder();
                    } else {
                        alert("تعذّر فتح مجلد الملفات، الرجاء إعادة تشغيل البرنامج.");
                    }
                });
            }
        });
    </script>
</head>
<body>
    <div class="bg-scene"></div>

    <div class="page">
        <div class="glass-panel">

            <div class="panel-header">
                <img src="img/main-httpswww.gdp.gov.saportalassetsimglogo.png" alt="الشعار">
                <div class="brand-text">
                    <h1>جوازات <span>مطار الملك خالد</span></h1>
                    <p>منصة النماذج والإجراءات</p>
                </div>
                <span id="date"></span>
            </div>

            <!-- المربعات الرئيسية: القدوم والمغادرة فقط -->
            <div class="hero-grid">
                <a href="Arrival.html" class="hero-card">
                    <span class="hero-ring"><i class="fas fa-plane-arrival"></i></span>
                    <h2>القدوم</h2>
                    <p>إجراءات ونماذج قدوم المسافرين</p>
                </a>

                <a href="Departure.html" class="hero-card">
                    <span class="hero-ring"><i class="fas fa-plane-departure"></i></span>
                    <h2>مغادرة</h2>
                    <p>إجراءات ونماذج مغادرة المسافرين</p>
                </a>
            </div>

            <div class="panel-divider"></div>

            <!-- أدوات ثانوية: أيقونة + عنوان الإجراء فقط -->
            <div class="utility-row">
                <a href="#" class="utility-card open-folder">
                    <span class="utility-icon"><i class="fas fa-folder-open"></i></span>
                    <strong>تعديل الملفات</strong>
                </a>

                <a href="#" class="utility-card" onclick="event.preventDefault(); checkPassword('update');">
                    <span class="utility-icon"><i class="fas fa-cloud-arrow-down"></i></span>
                    <strong>تحديث البرنامج كامل</strong>
                    <span class="lock-badge"><i class="fas fa-lock"></i></span>
                </a>

                <a href="control.html" class="utility-card">
                    <span class="utility-icon"><i class="fas fa-database"></i></span>
                    <strong>تعديل قاعدة البيانات</strong>
                </a>
            </div>

        </div>
    </div>

    <div id="password-container" class="password-container">
        <div class="password-box">
            <div class="lock-icon"><i class="fas fa-shield-halved"></i></div>
            <h3 id="password-box-title">تأكيد الدخول</h3>
            <p class="sub" id="password-box-sub">الرجاء إدخال الرقم السري للمتابعة</p>
            <input id="password-input" type="password" inputmode="numeric" placeholder="••••••">
            <input type="hidden" id="password-action" value="">
            <button onclick="verifyPassword()">تأكيد</button>
            <button class="close-btn" onclick="closePasswordBox()">إغلاق</button>
        </div>
    </div>
</body>
</html>
